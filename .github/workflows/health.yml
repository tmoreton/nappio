name: Monitor NapNear production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: github.repository == 'tmoreton/nappio'
    runs-on: ubuntu-latest
    steps:
      - name: Check pairing API
        run: |
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 https://nappio-pairing-api.tmoreton89.workers.dev/health)
          test "$(jq -r '.status' <<< "$response")" = "ok"
          test "$(jq -r '.storage' <<< "$response")" = "ok"
          test "$(jq -r '.signaling' <<< "$response")" = "configured"
          test "$(jq -r '.turn' <<< "$response")" = "configured"
          test "$(jq -r '.routing' <<< "$response")" = "sharded"
      - name: Check public support and privacy page
        run: |
          page=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 https://tmoreton.github.io/nappio/)
          echo "$page" | grep -q 'privacy-policy'
          echo "$page" | grep -q 'NapNear support'
