name: Monitor Nappio production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check pairing API
        run: |
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 https://nappio-pairing-api.tmoreton89.workers.dev/health)
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"storage":"ok"'
          echo "$response" | grep -q '"livekit":"configured"'
      - name: Check public support and privacy page
        run: |
          page=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 https://tmoreton.github.io/nappio/)
          echo "$page" | grep -q 'privacy-policy'
          echo "$page" | grep -q 'Nappio support'
