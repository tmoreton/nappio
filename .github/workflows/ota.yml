name: Publish NapNear OTA update

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-ota
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'tmoreton/NapNear'
    runs-on: ubuntu-latest
    steps:
      - name: Check for Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add an EXPO_TOKEN repository secret before publishing OTA updates."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm --prefix worker ci
      - name: Verify update
        run: npm run check
      - name: Verify Expo project health
        run: npx expo-doctor
      - name: Publish production update
        run: eas update --channel production --environment production --platform all --auto --non-interactive
